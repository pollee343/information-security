name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-security:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lab1/lab1_code

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: lab1/lab1_code/pom.xml

      - name: Allow Maven Wrapper execution
        run: chmod +x mvnw

      - name: Build and test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: ./mvnw --batch-mode clean verify

      - name: SpotBugs SAST
        run: >
          ./mvnw --batch-mode
          com.github.spotbugs:spotbugs-maven-plugin:4.10.4.1:check

      - name: OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          ./mvnw --batch-mode
          org.owasp:dependency-check-maven:13.0.0:check
          -DnvdApiKey="${NVD_API_KEY}"
          -DfailBuildOnCVSS=11

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            lab1/lab1_code/target/spotbugsXml.xml
            lab1/lab1_code/target/dependency-check-report.html
          if-no-files-found: warn
